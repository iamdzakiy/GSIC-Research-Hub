<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"><title>Lima mengapa: dari gejala ke akar masalah</title><desc>Tangga lima langkah, tiap langkah berupa pertanyaan Mengapa dan jawabannya, berakhir pada kotak Akar masalah yang bisa diteliti.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DDE5FA" stroke-width="1" opacity="0.9"/></pattern><marker id="ar-1FA77F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#1FA77F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-6580E2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6580E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="675" fill="#F7F8F2"/><rect width="1200" height="675" fill="url(#grid)"/><line x1="60.0" y1="70.0" x2="60.0" y2="512.0" stroke="#6580E2" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8"/><rect x="100.0" y="36.0" width="1070.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><circle cx="60.0" cy="78.0" r="22" fill="#3352CD"/><text x="60.0" y="85.3" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="120.0" y="82.0" font-size="22" fill="#0B1120" font-weight="700">Mengapa cabai cepat busuk?</text><line x1="540.0" y1="78.0" x2="574.0" y2="78.0" stroke="#6580E2" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-6580E2)"/><text x="590.0" y="82.0" font-size="22" fill="#334155">Disimpan pada suhu ruang yang panas dan</text><text x="590.0" y="110.1" font-size="22" fill="#334155">lembap.</text><rect x="100.0" y="128.0" width="1070.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><circle cx="60.0" cy="170.0" r="22" fill="#3352CD"/><text x="60.0" y="177.3" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="120.0" y="159.9" font-size="22" fill="#0B1120" font-weight="700">Mengapa disimpan di suhu</text><text x="120.0" y="188.0" font-size="22" fill="#0B1120" font-weight="700">ruang?</text><line x1="540.0" y1="170.0" x2="574.0" y2="170.0" stroke="#6580E2" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-6580E2)"/><text x="590.0" y="174.0" font-size="22" fill="#334155">Pedagang tidak punya pendingin.</text><rect x="100.0" y="220.0" width="1070.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><circle cx="60.0" cy="262.0" r="22" fill="#3352CD"/><text x="60.0" y="269.3" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="120.0" y="251.9" font-size="22" fill="#0B1120" font-weight="700">Mengapa tidak punya</text><text x="120.0" y="280.0" font-size="22" fill="#0B1120" font-weight="700">pendingin?</text><line x1="540.0" y1="262.0" x2="574.0" y2="262.0" stroke="#6580E2" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-6580E2)"/><text x="590.0" y="251.9" font-size="22" fill="#334155">Harga alat dan listriknya tidak sebanding dengan</text><text x="590.0" y="280.0" font-size="22" fill="#334155">margin.</text><rect x="100.0" y="312.0" width="1070.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><circle cx="60.0" cy="354.0" r="22" fill="#3352CD"/><text x="60.0" y="361.3" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="120.0" y="343.9" font-size="22" fill="#0B1120" font-weight="700">Mengapa tidak ada pilihan yang</text><text x="120.0" y="372.0" font-size="22" fill="#0B1120" font-weight="700">lebih murah?</text><line x1="540.0" y1="354.0" x2="574.0" y2="354.0" stroke="#6580E2" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-6580E2)"/><text x="590.0" y="343.9" font-size="22" fill="#334155">Solusi yang ada dirancang untuk gudang besar,</text><text x="590.0" y="372.0" font-size="22" fill="#334155">bukan lapak.</text><rect x="100.0" y="404.0" width="1070.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><circle cx="60.0" cy="446.0" r="22" fill="#3352CD"/><text x="60.0" y="453.3" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="120.0" y="435.9" font-size="22" fill="#0B1120" font-weight="700">Mengapa belum ada untuk</text><text x="120.0" y="464.0" font-size="22" fill="#0B1120" font-weight="700">lapak?</text><line x1="540.0" y1="446.0" x2="574.0" y2="446.0" stroke="#6580E2" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-6580E2)"/><text x="590.0" y="435.9" font-size="22" fill="#334155">Belum ada cara pengawetan murah yang diuji</text><text x="590.0" y="464.0" font-size="22" fill="#334155">pada skala pedagang kecil.</text><line x1="60.0" y1="488.0" x2="60.0" y2="532.0" stroke="#1FA77F" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-1FA77F)"/><rect x="100.0" y="502.0" width="1070.0" height="64.0" rx="10" fill="#5CE3B6" stroke="#1FA77F" stroke-width="2" stroke-linejoin="round"/><text x="635.0" y="538.7" font-size="26" fill="#0B1120" font-weight="700" text-anchor="middle">Akar masalah yang bisa diteliti</text></svg>
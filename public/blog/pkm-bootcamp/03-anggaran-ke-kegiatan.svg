<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"><title>Dari kegiatan ke pos anggaran</title><desc>Dua kolom dihubungkan garis: Kegiatan di kiri, Pos anggaran di kanan. Pembuatan larutan pelapis ke Kitosan, asam asetat, akuades; Perlakuan dan penyimpanan ke Cabai rawit, wadah, label; Pengamatan mutu ke Sewa atau penggunaan alat ukur, timbangan; Analisis dan pelaporan ke Cetak, publikasi.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DDE5FA" stroke-width="1" opacity="0.9"/></pattern><marker id="ar-3352CD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="675" fill="#F7F8F2"/><rect width="1200" height="675" fill="url(#grid)"/><text x="40.0" y="49.0" font-size="28" fill="#2943AD" font-weight="700">Kegiatan</text><text x="760.0" y="49.0" font-size="28" fill="#2943AD" font-weight="700">Pos anggaran</text><rect x="40.0" y="82.0" width="400.0" height="92.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="240.0" y="132.3" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Pembuatan larutan pelapis</text><rect x="760.0" y="82.0" width="400.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#1FA77F" stroke-width="2" stroke-linejoin="round"/><text x="960.0" y="132.3" font-size="24" fill="#0B1120" text-anchor="middle">Kitosan, asam asetat, akuades</text><line x1="444.0" y1="128.0" x2="756.0" y2="128.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><rect x="40.0" y="200.0" width="400.0" height="92.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="240.0" y="250.3" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Perlakuan &amp; penyimpanan</text><rect x="760.0" y="200.0" width="400.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#1FA77F" stroke-width="2" stroke-linejoin="round"/><text x="960.0" y="250.3" font-size="24" fill="#0B1120" text-anchor="middle">Cabai rawit, wadah, label</text><line x1="444.0" y1="246.0" x2="756.0" y2="246.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><rect x="40.0" y="318.0" width="400.0" height="92.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="240.0" y="368.3" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Pengamatan mutu</text><rect x="760.0" y="318.0" width="400.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#1FA77F" stroke-width="2" stroke-linejoin="round"/><text x="960.0" y="353.0" font-size="24" fill="#0B1120" text-anchor="middle">Sewa/penggunaan alat ukur,</text><text x="960.0" y="383.7" font-size="24" fill="#0B1120" text-anchor="middle">timbangan</text><line x1="444.0" y1="364.0" x2="756.0" y2="364.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><rect x="40.0" y="436.0" width="400.0" height="92.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="240.0" y="486.3" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Analisis &amp; pelaporan</text><rect x="760.0" y="436.0" width="400.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#1FA77F" stroke-width="2" stroke-linejoin="round"/><text x="960.0" y="486.3" font-size="24" fill="#0B1120" text-anchor="middle">Cetak, publikasi</text><line x1="444.0" y1="482.0" x2="756.0" y2="482.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><text x="600.0" y="599.7" font-size="24" fill="#0B1120" font-weight="700" text-anchor
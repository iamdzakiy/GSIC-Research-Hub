<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"><title>Pohon keputusan memilih skema PKM</title><desc>Dari pertanyaan akar, Apa bentuk luaran utamamu, empat cabang menuju PKM-RE, PKM-KC, PKM-GFT dan PKM-K, masing-masing dengan satu pertanyaan penuntun.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DDE5FA" stroke-width="1" opacity="0.9"/></pattern><marker id="ar-3352CD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="675" fill="#F7F8F2"/><rect width="1200" height="675" fill="url(#grid)"/><rect x="340.0" y="40.0" width="520.0" height="76.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="600.0" y="82.7" font-size="26" fill="#0B1120" font-weight="700" text-anchor="middle">Apa bentuk luaran utamamu?</text><path d="M600,116 V150 H162.0 V190" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-3352CD)"/><rect x="28.0" y="194.0" width="268.0" height="126.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="162.0" y="246.9" font-size="22" fill="#0B1120" text-anchor="middle">Data hasil percobaan</text><text x="162.0" y="275.0" font-size="22" fill="#0B1120" text-anchor="middle">atau pengukuran</text><line x1="162.0" y1="320.0" x2="162.0" y2="372.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><rect x="52.0" y="376.0" width="220.0" height="64.0" rx="12" fill="#3352CD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="162.0" y="413.4" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">PKM-RE</text><text x="162.0" y="488.0" font-size="22" fill="#334155" text-anchor="middle">Pertanyaan: apakah X</text><text x="162.0" y="516.2" font-size="22" fill="#334155" text-anchor="middle">memengaruhi Y?</text><path d="M600,116 V150 H454.0 V190" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-3352CD)"/><rect x="320.0" y="194.0" width="268.0" height="126.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="454.0" y="232.8" font-size="22" fill="#0B1120" text-anchor="middle">Alat, aplikasi atau</text><text x="454.0" y="261.0" font-size="22" fill="#0B1120" text-anchor="middle">purwarupa yang</text><text x="454.0" y="289.1" font-size="22" fill="#0B1120" text-anchor="middle">berfungsi</text><line x1="454.0" y1="320.0" x2="454.0" y2="372.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><rect x="344.0" y="376.0" width="220.0" height="64.0" rx="12" fill="#3352CD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="454.0" y="413.4" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">PKM-KC</text><text x="454.0" y="488.0" font-size="22" fill="#334155" text-anchor="middle">Pertanyaan: bisakah</text><text x="454.0" y="516.2" font-size="22" fill="#334155" text-anchor="middle">alat ini bekerja?</text><path d="M600,116 V150 H746.0 V190" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-3352CD)"/><rect x="612.0" y="194.0" width="268.0" height="126.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="746.0" y="246.9" font-size="22" fill="#0B1120" text-anchor="middle">Gagasan masa depan</text><text x="746.0" y="275.0" font-size="22" fill="#0B1120" text-anchor="middle">dalam bentuk tulisan</text><line x1="746.0" y1="320.0" x2="746.0" y2="372.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><rect x="636.0" y="376.0" width="220.0" height="64.0" rx="12" fill="#3352CD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="746.0" y="413.4" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">PKM-GFT</text><text x="746.0" y="488.0" font-size="22" fill="#334155" text-anchor="middle">Pertanyaan:</text><text x="746.0" y="516.2" font-size="22" fill="#334155" text-anchor="middle">bagaimana jika pada</text><text x="746.0" y="544.4" font-size="22" fill="#334155" text-anchor="middle">2045...?</text><path d="M600,116 V150 H1038.0 V190" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-3352CD)"/><rect x="904.0" y="194.0" width="268.0" height="126.0" rx="10" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="1038.0" y="232.8" font-size="22" fill="#0B1120" text-anchor="middle">Produk yang dijual</text><text x="1038.0" y="261.0" font-size="22" fill="#0B1120" text-anchor="middle">dan menghasilkan</text><text x="1038.0" y="289.1" font-size="22" fill="#0B1120" text-anchor="middle">pendapatan</text><line x1="1038.0" y1="320.0" x2="1038.0" y2="372.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><rect x="928.0" y="376.0" width="220.0" height="64.0" rx="12" fill="#3352CD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="1038.0" y="413.4" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">PKM-K</text><text x="1038.0" y="488.0" font-size="22" fill="#334155" text-anchor="middle">Pertanyaan: siapa yang</text><text x="1038.0" y="516.2" font-size="22" fill="#334155" text-anchor="middle">mau membeli?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"><title>Corong pendahuluan: dari luas ke spesifik</title><desc>Corong empat lapis dari lebar ke sempit: Konteks, Masalah spesifik dengan data, Celah, Tujuan dan gagasanmu. Tiap lapis satu paragraf. Panah di sisi kiri berlabel luas ke spesifik.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DDE5FA" stroke-width="1" opacity="0.9"/></pattern><marker id="ar-3352CD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="675" fill="#F7F8F2"/><rect width="1200" height="675" fill="url(#grid)"/><path d="M130.0,60 H910.0 L870.0,170 H170.0 Z" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="520.0" y="119.3" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Konteks: mengapa topik ini penting</text><line x1="900.0" y1="115.0" x2="936.0" y2="115.0" stroke="#5B6475" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><text x="948.0" y="119.7" font-size="24" fill="#0B1120">1 paragraf</text><path d="M170.0,182 H870.0 L830.0,292 H210.0 Z" fill="#DDE5FA" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="520.0" y="241.3" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Masalah spesifik + data</text><line x1="860.0" y1="237.0" x2="936.0" y2="237.0" stroke="#5B6475" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><text x="948.0" y="241.7" font-size="24" fill="#0B1120">1 paragraf</text><path d="M210.0,304 H830.0 L790.0,414 H250.0 Z" fill="#BDCBF5" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="520.0" y="348.0" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Celah: apa yang belum dijawab solusi</text><text x="520.0" y="378.7" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">kini</text><line x1="820.0" y1="359.0" x2="936.0" y2="359.0" stroke="#5B6475" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><text x="948.0" y="363.7" font-size="24" fill="#0B1120">1 paragraf</text><path d="M250.0,426 H790.0 L750.0,536 H290.0 Z" fill="#93A8EE" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="520.0" y="485.3" font-size="24" fill="#0B1120" font-weight="700" text-anchor="middle">Tujuan dan gagasanmu</text><line x1="780.0" y1="481.0" x2="936.0" y2="481.0" stroke="#5B6475" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><text x="948.0" y="485.7" font-size="24" fill="#0B1120">1 paragraf</text><line x1="70.0" y1="70.0" x2="70.0" y2="520.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-3352CD)"/><text transform="translate(52 300) rotate(-90)" font-size="24" fill="#2943AD" font-weight="700" text-anchor="middle">luas → spesifik</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"><title>TAM pasar pertama dihitung dua arah</title><desc>Dua corong bertemu di satu kotak TAM pasar pertama. Top-down: Semua warung makan di kota, Yang berada di sekitar kampus, Yang memakai sambal setiap hari. Bottom-up: Hitung warung di 3 ruas jalan, Kepadatan per ruas, Kalikan jumlah ruas serupa. Rumus: Jumlah pengguna × pendapatan per pengguna per tahun.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DDE5FA" stroke-width="1" opacity="0.9"/></pattern><marker id="ar-1FA77F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#1FA77F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ar-3352CD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="675" fill="#F7F8F2"/><rect width="1200" height="675" fill="url(#grid)"/><text x="280.0" y="37.3" font-size="26" fill="#3352CD" font-weight="700" text-anchor="middle">Top-down</text><path d="M30.0,56 H530.0 L495.0,140 H65.0 Z" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="280.0" y="102.0" font-size="22" fill="#0B1120" text-anchor="middle">Semua warung makan di kota</text><path d="M65.0,148 H495.0 L460.0,232 H100.0 Z" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="280.0" y="179.9" font-size="22" fill="#0B1120" text-anchor="middle">Yang berada di sekitar</text><text x="280.0" y="208.0" font-size="22" 
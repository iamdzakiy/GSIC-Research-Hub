<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"><title>Kartu persona pemilik warung makan</title><desc>Kartu persona fiktif: Bu Rina, 42, pemilik warung makan dekat kampus, dengan empat blok: Sehari-hari, Prioritas, Kekhawatiran, Sumber info.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DDE5FA" stroke-width="1" opacity="0.9"/></pattern></defs><rect width="1200" height="675" fill="#F7F8F2"/><rect width="1200" height="675" fill="url(#grid)"/><rect x="50.0" y="28.0" width="1100.0" height="118.0" rx="14" fill="#FFFFFF" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><circle cx="122.0" cy="87.0" r="44" fill="#DDE5FA" stroke="#3352CD" stroke-width="2"/><circle cx="122.0" cy="74.0" r="14" fill="#93A8EE" stroke="#3352CD" stroke-width="2"/><path d="M92,118 Q92,98 122,98 Q152,98 152,118" fill="#93A8EE" stroke="#3352CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="196.0" y="83.0" font-size="28" fill="#0B1120" font-weight="700">Bu Rina, 42, pemilik warung makan dekat kampus</text><rect x="50.0" y="170.0" width="540.0" height="172.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="72.0" y="203.7" font-size="24" fill="#2943AD" font-weight="700">Sehari-hari</text><text x="72.0" y="243.7" font-size="24" fill="#0B1120">belanja ke pasar pukul 05.00, masak,</text><text x="72.0" y="274.4" font-size="24" fill="#0B1120">buka 10.00–20.00</text><rect x="610.0" y="170.0" width="540.0" height="172.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="632.0" y="203.7" font-size="24" fill="#2943AD" font-weight="700">Prioritas</text><text x="632.0" y="243.7" font-size="24" fill="#0B1120">1 Rasa konsisten</text><text x="632.0" y="274.4" font-size="24" fill="#0B1120">2 Biaya bahan stabil</text><text x="632.0" y="305.1" font-size="24" fill="#0B1120">3 Hemat waktu</text><rect x="50.0" y="360.0" width="540.0" height="172.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="72.0" y="393.7" font-size="24" fill="#2943AD" font-weight="700">Kekhawatiran</text><text x="72.0" y="433.7" font-size="24" fill="#0B1120">harga cabai melonjak, sambal cepat basi</text><rect x="610.0" y="360.0" width="540.0" height="172.0" rx="12" fill="#EFF3FD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="632.0" y="393.7" font-size="24" fill="#2943AD" font-weight="700">Sumber info</text><text x="632.0" y="433.7" font-size="24" fill="#0B1120">grup WhatsApp pedagang, tetangga</text><text x="632.0" y="464.4" font-size="24" fill="#0B1120">lapak</text><text x="50.0" y="588.0" font-size="22" fill="#5B6475">Persona fiktif untuk contoh</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"><title>Diagram tulang ikan penyebab cabai rawit cepat busuk</title><desc>Kepala: Cabai rawit cepat busuk di pasar tradisional. Enam kategori masing-masing dengan dua penyebab: Manusia, Metode, Alat dan fasilitas, Material, Lingkungan, Ekonomi. Penyebab Tidak ada penyimpanan dingin dilingkari dan diberi catatan bisa diintervensi.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DDE5FA" stroke-width="1" opacity="0.9"/></pattern></defs><rect width="1200" height="675" fill="#F7F8F2"/><rect width="1200" height="675" fill="url(#grid)"/><line x1="30.0" y1="350.0" x2="890.0" y2="350.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><rect x="900.0" y="250.0" width="270.0" height="200.0" rx="12" fill="#3352CD" stroke="#3352CD" stroke-width="2" stroke-linejoin="round"/><text x="1035.0" y="323.6" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">Cabai rawit cepat</text><text x="1035.0" y="354.3" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">busuk di pasar</text><text x="1035.0" y="385.0" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">tradisional</text><line x1="260.0" y1="82.0" x2="330.0" y2="350.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="260.0" y="67.7" font-size="24" fill="#2943AD" font-weight="700" text-anchor="middle">Manusia</text><line x1="255.8" y1="150.0" x2="277.8" y2="150.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="247.8" y="125.8" font-size="22" fill="#0B1120" text-anchor="end">Penanganan</text><text x="247.8" y="154.0" font-size="22" fill="#0B1120" text-anchor="end">kasar saat</text><text x="247.8" y="182.1" font-size="22" fill="#0B1120" text-anchor="end">bongkar muat</text><line x1="288.4" y1="275.0" x2="310.4" y2="275.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="280.4" y="279.0" font-size="22" fill="#0B1120" text-anchor="end">Tidak ada sortasi</text><line x1="540.0" y1="82.0" x2="610.0" y2="350.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="540.0" y="67.7" font-size="24" fill="#2943AD" font-weight="700" text-anchor="middle">Metode</text><line x1="535.8" y1="150.0" x2="557.8" y2="150.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="527.8" y="139.9" font-size="22" fill="#0B1120" text-anchor="end">Ditumpuk tanpa</text><text x="527.8" y="168.0" font-size="22" fill="#0B1120" text-anchor="end">sirkulasi udara</text><line x1="568.4" y1="275.0" x2="590.4" y2="275.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="560.4" y="264.9" font-size="22" fill="#0B1120" text-anchor="end">Dicuci lalu tidak</text><text x="560.4" y="293.0" font-size="22" fill="#0B1120" text-anchor="end">dikeringkan</text><line x1="820.0" y1="82.0" x2="890.0" y2="350.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="820.0" y="67.7" font-size="24" fill="#2943AD" font-weight="700" text-anchor="middle">Alat &amp; fasilitas</text><line x1="815.8" y1="150.0" x2="837.8" y2="150.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="807.8" y="125.8" font-size="22" fill="#0B1120" text-anchor="end">Tidak ada</text><text x="807.8" y="154.0" font-size="22" fill="#0B1120" text-anchor="end">penyimpanan</text><text x="807.8" y="182.1" font-size="22" fill="#0B1120" text-anchor="end">dingin</text><ellipse cx="707.8" cy="150.0" rx="116" ry="58.2" fill="none" stroke="#1FA77F" stroke-width="2"/><text x="707.8" y="232.3" font-size="22" fill="#0F7E5E" font-weight="700" text-anchor="middle">bisa diintervensi</text><line x1="848.4" y1="275.0" x2="870.4" y2="275.0" stroke="#3352CD" stroke-width="2" stroke-linecap="round"/><text x="840.4" y="264.9" font-size="2